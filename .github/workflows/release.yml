name: Publish Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag matching Cargo.toml (for example v0.1.2)
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid stable tag' }
          $text = Get-Content Cargo.toml -Raw
          if ($text -notmatch '(?m)^version = "([^"]+)"') { throw 'Missing version' }
          if ($env:RELEASE_TAG -ne ('v' + $Matches[1])) { throw 'Tag must match Cargo.toml' }
      - name: Install pinned Rust
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Test and build
        shell: pwsh
        run: |
          ./scripts/generate-notices.ps1
          cargo +1.100.0 fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.100.0 clippy --locked --features desktop --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.100.0 test --locked --features desktop --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.100.0 build --release --locked --features desktop --bins
          exit $LASTEXITCODE
      - name: Package and record actual signing status
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - name: Keep build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roynit-windows-release
          path: |
            dist/*.zip
            dist/riff-rust-windows-x64.exe
            dist/riff-rust-windows-x64.exe.sha256
            dist/signing-status.json
      - name: Publish version assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; use a new version instead of replacing assets' }
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -in @('riff-rust-windows-x64.exe','riff-rust-windows-x64.exe.sha256','signing-status.json') } | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title ('Roynit Music ' + $env:RELEASE_TAG) --notes-file CHANGELOG.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
