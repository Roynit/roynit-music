[package]
name = "riff-core"
version = "0.2.3"
edition = "2024"
build = "build.rs"
license = "MIT"
authors = ["dang"]
repository = "https://github.com/Roynit/roynit-music"
description = "Roy Music native Rust music player"

[lib]
name = "riff_core"

[[bin]]
name = "roy"
path = "src/main.rs"

[[bin]]
name = "roy-music"
path = "src/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "roy-setup"
path = "src/setup.rs"
required-features = ["desktop"]

[[example]]
name = "chromium_audit"
required-features = ["chromium-audit"]

[features]
chromium-audit = ["dep:webview2-com", "dep:windows"]
default = []
desktop = ["dep:eframe", "dep:egui_extras", "dep:image", "dep:rfd", "dep:open", "dep:tray-icon", "dep:souvlaki", "dep:raw-window-handle", "dep:unicode-segmentation"]

[dependencies]
unicode-segmentation = { version = "1.13.3", optional = true }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.16"
directories = "6"
discord-rich-presence = "1.1"
fs2 = "0.4"
flate2 = "1"
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland"], optional = true }
egui_extras = { version = "0.33.3", features = ["image", "http"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
rfd = { version = "0.15", optional = true }
open = { version = "5", optional = true }
tray-icon = { version = "0.21", default-features = false, optional = true }
souvlaki = { version = "0.8.3", optional = true }
raw-window-handle = { version = "0.6", optional = true }
md5 = "0.7"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.24"
sha2 = "0.10"
sha1 = "0.10"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }


webview2-com = { version = "0.39.1", optional = true }
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_WindowsAndMessaging"], optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
